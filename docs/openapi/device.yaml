openapi: 3.0.1
info:
  title: Device Repository API
  description: API that manages device entities.
  version: 1.0.0
servers:
- url: http://localhost/api/v1
tags:
- name: device
  description: Device management
paths:
  /device:
    put:
      tags:
      - device
      summary: Update an existing device
      requestBody:
        description: Device object that needs to be updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
        required: true
      responses:
        "400":
          description: Invalid ID supplied
          content: {}
        "404":
          description: Device is not found
          content: {}
        "422":
          description: Validation exception
          content: {}
      x-codegen-request-body-name: body
    post:
      tags:
      - device
      summary: Add a new device
      requestBody:
        description: Device object that needs to be added
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
        required: true
      responses:
        "400":
          description: Invalid input
          content: {}
        "422":
          description: Validation exception
          content: {}
      x-codegen-request-body-name: body
  /device/queryByUser:
    get:
      tags:
      - device
      summary: Queries devices by user
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        "400":
          description: Invalid status value
          content: {}
  /device/queryBySite:
    get:
      tags:
      - device
      summary: Queries devices by site
      parameters:
      - name: siteId
        in: query
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        "400":
          description: Invalid status value
          content: {}
  /device/{deviceId}:
    get:
      tags:
      - device
      summary: Gets device by ID
      description: Returns a device
      parameters:
      - name: deviceId
        in: path
        description: ID of device to return
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        "400":
          description: Invalid ID supplied
          content: {}
        "404":
          description: Device not found
          content: {}
    delete:
      tags:
      - device
      summary: Deletes a device
      parameters:
      - name: deviceId
        in: path
        description: ID of device to delete
        required: true
        schema:
          type: integer
      responses:
        "400":
          description: Invalid ID supplied
          content: {}
        "404":
          description: Device not found
          content: {}
components:
  schemas:
    Device:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        site_id:
          type: integer
        model_id:
          type: integer
        connection:
          type: string
        state:
          type: integer
x-original-swagger-version: "2.0"

