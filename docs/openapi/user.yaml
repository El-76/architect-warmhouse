openapi: 3.0.1
info:
  title: User Repository API
  description: API that manages user entities.
  version: 1.0.0
servers:
- url: http://localhost/api/v1
tags:
- name: user
  description: User management
paths:
  /user:
    put:
      tags:
      - user
      summary: Update an existing user
      requestBody:
        description: User object that needs to be updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        "400":
          description: Invalid ID supplied
          content: {}
        "404":
          description: User is not found
          content: {}
        "422":
          description: Validation exception
          content: {}
      x-codegen-request-body-name: body
    post:
      tags:
      - user
      summary: Add a new user
      requestBody:
        description: User object that needs to be added
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        "400":
          description: Invalid input
          content: {}
        "422":
          description: Validation exception
          content: {}
      x-codegen-request-body-name: body
  /user/queryBySite:
    get:
      tags:
      - user
      summary: Queries users by site
      parameters:
      - name: siteId
        in: query
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        "400":
          description: Invalid status value
          content: {}
  /user/{userId}:
    get:
      tags:
      - user
      summary: Gets user by ID
      description: Returns a user
      parameters:
      - name: userId
        in: path
        description: ID of user to return
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: Invalid ID supplied
          content: {}
        "404":
          description: User not found
          content: {}
    delete:
      tags:
      - user
      summary: Deletes a user
      parameters:
      - name: userId
        in: path
        description: ID of user to delete
        required: true
        schema:
          type: integer
      responses:
        "400":
          description: Invalid ID supplied
          content: {}
        "404":
          description: User not found
          content: {}
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
x-original-swagger-version: "2.0"

